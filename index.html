<style>
  :root {
    --navy: #0a1628;
    --navy-mid: #0f2040;
    --slate: #1e3a5f;
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --gold-pale: #f5e9c8;
    --white: #ffffff;
    --off-white: #f8f7f4;
    --text-muted: #8a99b0;
    --border: rgba(201,168,76,0.2);
    --transition: all 0.4s cubic-bezier(0.25,0.46,0.45,0.94);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Inter', sans-serif; background: var(--navy); color: var(--white); overflow-x: hidden; }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--navy); }
  ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 3px; }

  /* ── NAV ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 5%; height: 70px;
    background: rgba(10,22,40,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    transition: var(--transition);
  }
  nav.scrolled { background: rgba(10,22,40,0.98); box-shadow: 0 4px 30px rgba(0,0,0,0.4); }
  .nav-logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem; font-weight: 700;
    color: var(--white); text-decoration: none; letter-spacing: 0.02em;
  }
  .nav-logo span { color: var(--gold); }
  .nav-links { display: flex; align-items: center; gap: 2.2rem; list-style: none; }
  .nav-links a {
    color: var(--text-muted); text-decoration: none;
    font-size: 0.85rem; font-weight: 500; letter-spacing: 0.06em;
    text-transform: uppercase; transition: var(--transition); cursor: pointer;
  }
  .nav-links a:hover { color: var(--gold); }
  .nav-cta {
    background: var(--gold); color: var(--navy) !important;
    padding: 0.55rem 1.3rem; border-radius: 4px;
    font-weight: 700 !important; letter-spacing: 0.04em !important;
    transition: var(--transition) !important;
  }
  .nav-cta:hover { background: var(--gold-light) !important; transform: translateY(-1px); }
  .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 4px; }
  .hamburger span { display: block; width: 24px; height: 2px; background: var(--white); transition: var(--transition); border-radius: 2px; }
  .mobile-menu {
    display: none; position: fixed; top: 70px; left: 0; right: 0;
    background: rgba(10,22,40,0.98); backdrop-filter: blur(12px);
    padding: 2rem 5%; z-index: 999; border-bottom: 1px solid var(--border);
  }
  .mobile-menu.open { display: block; }
  .mobile-menu a { display: block; color: var(--white); text-decoration: none; padding: 0.9rem 0; font-size: 1rem; font-weight: 500; border-bottom: 1px solid var(--border); }
  .mobile-menu a:last-child { border-bottom: none; color: var(--gold); font-weight: 700; }
  @media(max-width:768px) { .nav-links { display: none; } .hamburger { display: flex; } }

  /* ── SECTIONS ── */
  section { padding: 7rem 5%; }
  .section-label {
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--gold); margin-bottom: 1rem;
  }
  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 4vw, 3rem); font-weight: 700;
    line-height: 1.2; color: var(--white); margin-bottom: 1.5rem;
  }
  .section-title span { color: var(--gold); }
  .divider { width: 60px; height: 3px; background: var(--gold); margin-bottom: 2.5rem; }

  /* ── HERO ── */
  #hero {
    min-height: 100vh; display: flex; align-items: center;
    background: linear-gradient(135deg, rgba(10,22,40,0.88) 0%, rgba(15,32,64,0.95) 100%), url('assets/hero-bg.jpg') center/cover no-repeat;
    position: relative; overflow: hidden; padding-top: 100px;
  }
  .hero-grid {
    position: absolute; inset: 0; opacity: 0.04;
    background-image: linear-gradient(var(--gold) 1px, transparent 1px), linear-gradient(90deg, var(--gold) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .hero-glow {
    position: absolute; width: 600px; height: 600px; border-radius: 50%;
    background: radial-gradient(circle, rgba(201,168,76,0.08) 0%, transparent 70%);
    top: -100px; right: -100px; pointer-events: none;
  }
  .hero-content { position: relative; z-index: 2; max-width: 1100px; display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: center; }
  @media(max-width: 900px) { .hero-content { grid-template-columns: 1fr; gap: 2.5rem; } }
  
  .hero-badge {
    display: inline-flex; align-items: center; gap: 0.5rem;
    background: rgba(201,168,76,0.1); border: 1px solid var(--border);
    color: var(--gold); font-size: 0.78rem; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase;
    padding: 0.45rem 1rem; border-radius: 30px; margin-bottom: 2rem;
  }
  .hero-badge::before { content: '●'; font-size: 0.5rem; animation: pulse 2s infinite; color: #10b981; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
  
  .hero-headline {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.4rem, 5vw, 4rem);
    font-weight: 900; line-height: 1.08; margin-bottom: 1.5rem;
    background: linear-gradient(135deg, var(--white) 0%, var(--gold-light) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .hero-sub {
    font-size: clamp(1rem, 2vw, 1.15rem); color: var(--text-muted);
    line-height: 1.75; margin-bottom: 2.5rem; font-weight: 400;
  }
  .hero-sub strong { color: var(--white); font-weight: 600; }
  .hero-ctas { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 3.5rem; }
  .btn-primary {
    background: var(--gold); color: var(--navy); font-weight: 700;
    padding: 0.85rem 2rem; border-radius: 4px; text-decoration: none;
    font-size: 0.9rem; letter-spacing: 0.04em; transition: var(--transition);
    display: inline-flex; align-items: center; gap: 0.5rem; cursor: pointer;
  }
  .btn-primary:hover { background: var(--gold-light); transform: translateY(-2px); box-shadow: 0 8px 25px rgba(201,168,76,0.3); }
  .btn-secondary {
    border: 1.5px solid var(--border); color: var(--white); font-weight: 600;
    padding: 0.85rem 2rem; border-radius: 4px; text-decoration: none;
    font-size: 0.9rem; letter-spacing: 0.04em; transition: var(--transition);
    display: inline-flex; align-items: center; gap: 0.5rem; cursor: pointer;
  }
  .btn-secondary:hover { border-color: var(--gold); color: var(--gold); transform: translateY(-2px); }

  /* ── INTERACTIVE COCKPIT MAP ── */
  .hero-cockpit {
    position: relative; height: 380px; width: 100%;
    background: linear-gradient(90deg, rgba(201,168,76,0.04) 1px, transparent 1px), linear-gradient(rgba(201,168,76,0.04) 1px, transparent 1px);
    background-size: 36px 36px; border: 1px solid var(--border); border-radius: 14px;
    background-color: rgba(10,22,40,0.6); box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    backdrop-filter: blur(10px); overflow: hidden;
  }

    position: absolute; width: 150px; padding: 12px; text-align: center;
    border: 1px solid rgba(138, 153, 176, 0.3);
