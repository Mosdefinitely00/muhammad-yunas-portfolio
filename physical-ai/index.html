<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Industrial Autonomy Stack | Muhammad A. Yunas</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/><style>body{margin:0;background:#0A0F1F;color:#fff;font-family:Inter,sans-serif}header,main{max-width:960px;margin:0 auto;padding:20px}a{color:#D4A857}h1{font-weight:600;font-size:clamp(28px,4vw,40px)}canvas{width:100%;border:1px solid rgba(26,124,255,.5);border-radius:12px;background:#070b16}.lock{color:#D4A857;font-weight:600}.start-here{margin-top:28px;padding-top:20px;border-top:1px solid rgba(212,168,87,.45)}.start-here h2{font-size:24px;font-weight:600;margin:0 0 6px}.start-here p{color:#C8CCD4;margin:0 0 14px}.start-here a{display:inline-block;background:#1A7CFF;color:#fff;text-decoration:none;font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:13px;padding:12px 16px;border-radius:4px}</style></head><body><header><a href="../index.html">Muhammad A. Yunas</a></header><main><p style="letter-spacing:.12em;text-transform:uppercase;color:#D4A857;font-size:.75rem">Physical AI · Industrial Autonomy</p><h1>The Industrial Autonomy Stack</h1><p>Four layers. One system. Not a coaster.</p><canvas id="c" width="960" height="420"></canvas><p class="lock" id="lock">Sequence starting…</p><button type="button" onclick="replayStack()" style="margin-top:12px;background:#D4A857;color:#0A0F1F;border:0;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:10px 14px;border-radius:4px;">Replay</button><section class="start-here"><h2>Start Here</h2><p>Understand the Industrial Autonomy Stack</p><a href="#c">Explore the Stack</a></section></main><script>
var c=document.getElementById("c"),x=c.getContext("2d"),lock=document.getElementById("lock"),s=0;
var phases=["Digital twin layer","Grid and asset outlines","Physical AI — decision nodes","Edge inference","Autonomy orchestration","Industrial Autonomy Infrastructure — Online"];
function ease(u){u=Math.max(0,Math.min(1,u));return 1-Math.pow(1-u,3);}function draw(n){if(!s)s=n;var raw=Math.min(1,(n-s)/7200);var t=ease(raw)*7.2;var w=c.width,h=c.height;x.fillStyle="#0A0F1F";x.fillRect(0,0,w,h);
if(t>.3){x.strokeStyle="rgba(26,124,255,.35)";for(var i=40;i<w;i+=48){x.beginPath();x.moveTo(i,30);x.lineTo(i,h-30);x.stroke();}for(var j=30;j<h;j+=48){x.beginPath();x.moveTo(40,j);x.lineTo(w-40,j);x.stroke();}}
if(t>1.4){x.strokeStyle="#C8CCD4";x.strokeRect(120,70,200,120);x.strokeRect(640,70,200,120);}
if(t>2.6){x.fillStyle="#1A7CFF";[[220,130],[480,160],[740,130]].forEach(function(p){x.beginPath();x.arc(p[0],p[1],5,0,6.28);x.fill();});}
if(t>4){x.strokeStyle="#D4A857";x.beginPath();x.moveTo(80,300);x.lineTo(200,240);x.lineTo(520,220);x.stroke();}
if(t>5.2){x.strokeStyle="#1A7CFF";for(var a=0;a<6;a++){var ax=160+a*120;x.beginPath();x.arc(ax,340,16,0,6.28);x.stroke();}}
lock.textContent=phases[t<0.3?0:t<1.4?1:t<2.6?2:t<4?3:t<5.2?4:5];if(t<7.2)requestAnimationFrame(draw);window.replayStack=function(){s=0;requestAnimationFrame(draw);};}requestAnimationFrame(draw);
</script></body></html>
